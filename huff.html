<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="ffavicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huff — Caleb McCarthy</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--w:#f0ece4;--b:#090909;--g:#777}
html,body{width:100%;min-height:100%;background:var(--b);color:var(--w);font-family:'Special Elite',cursive}
body::before{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.045;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
background-size:200px 200px;animation:gr .4s steps(1) infinite}
@keyframes gr{0%{transform:translate(0,0)}25%{transform:translate(-2px,-2px)}50%{transform:translate(2px,1px)}75%{transform:translate(-1px,2px)}100%{transform:translate(0,0)}}
.inner{max-width:1060px;margin:0 auto;padding:4rem 2rem 6rem}
.page-header{display:flex;align-items:baseline;gap:2rem;margin-bottom:4rem;border-bottom:1px solid #1c1c1c;padding-bottom:1.5rem}
.page-title{font-family:'Special Elite',cursive;font-size:clamp(2rem,6vw,4rem);color:var(--w);letter-spacing:.04em}
.back-link{font-family:'Special Elite',cursive;font-size:1.35rem;letter-spacing:.1em;color:#aaa;text-decoration:none;margin-left:auto;transition:color .3s}
.back-link:hover{color:#fff}

/* TOP SECTION */
.film-top{display:grid;grid-template-columns:1fr 1fr;gap:3rem;margin-bottom:4rem;align-items:start}
@media(max-width:700px){.film-top{grid-template-columns:1fr}}
.film-video{width:100%;aspect-ratio:16/9}
.film-video iframe{width:100%;height:100%;border:none;display:block}
.film-info{display:flex;flex-direction:column;gap:1.2rem;padding-top:.5rem}
.film-year{font-family:'Courier Prime',monospace;font-size:.65rem;letter-spacing:.4em;color:#444;text-transform:uppercase}
.film-logline{font-family:'Courier Prime',monospace;font-style:italic;font-size:.9rem;color:#999;line-height:1.6}
.film-desc{font-family:'Courier Prime',monospace;font-size:.78rem;line-height:1.9;color:#666}

/* LAURELS */
.laurels-banner{width:100%;margin-bottom:3rem}
.laurels-banner img{width:100%;height:auto;display:block}

/* BTS */
.section-label{font-family:'Courier Prime',monospace;font-size:.72rem;letter-spacing:.4em;color:#3a3a3a;text-transform:uppercase;margin-bottom:2rem;display:flex;align-items:center;gap:1.2rem}
.section-label::after{content:'';flex:1;height:1px;background:#161616}
.bts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.bts-grid img{width:100%;height:220px;object-fit:cover;display:block;filter:grayscale(100%);transition:filter .5s,transform .5s}
.bts-grid img:hover{filter:grayscale(0%);transform:scale(1.02)}

.footer{text-align:center;padding:2rem;font-family:'Courier Prime',monospace;font-size:.55rem;letter-spacing:.25em;color:#1a1a1a;text-transform:uppercase}
</style>
</head>
<body>
<div class="inner">
  <div class="page-header">
    <h2 class="page-title">Huff</h2>
    <a href="portfolio.html" class="back-link">&#8592; Portfolio</a>
  </div>

  <div class="film-top">
    <div class="film-video">
      <iframe src="https://player.vimeo.com/video/1093271312?h=f9862152df&color=ffffff" allow="fullscreen;picture-in-picture" allowfullscreen></iframe>
    </div>
    <div class="film-info">
      <div class="film-year">2025</div>
      <div class="film-logline">We all have a vice</div>
      <div class="film-desc">A desperate man spirals into a chase to recover his stolen fix, stumbling into an office world filled with scrutiny, uniformity, and oppressive compulsions.</div>
    </div>
  </div>

  <div class="laurels-banner">
    <img src="images/films/HUFFLuarals.png" alt="Huff Laurels">
  </div>

  <div class="section-label">Behind the Scenes</div>
  <div class="bts-grid">
    <img src="images/BTS/Huffbathroom.jpg" alt="BTS">
    <img src="images/BTS/Saraortegahuffcaleb.jpg" alt="BTS">
    <img src="images/BTS/CarrieCalebJoelMaxHUFF.jpg" alt="BTS">
    <img src="images/BTS/Wolfcalebhuffsign.jpg" alt="BTS">
  </div>
</div>
<div class="footer">Caleb McCarthy &mdash; Filmmaker</div>
</body>
</html>
